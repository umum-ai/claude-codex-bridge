[tools]
bun = "1.4.0"
codex = "0.153.4"
claude = "2.1.261"
node = "26.8.1"
prek = "0.4.14"
rumdl = "0.2.61"

[tasks.setup]
run = ["bun install --frozen-lockfile", "codex app-server generate-ts --experimental --out .generated", "git config --get core.hooksPath > /dev/null || prek install"]

[tasks.check]
depends = ["build"]
run = ["bun scripts/release.ts verify", "rumdl check .", "bunx --no-install biome check .", "bunx --no-install tsc --noEmit", "bun test --randomize --coverage", "bun scripts/coverage.ts"]

[tasks.test]
depends = ["build"]
run = ["bun test --randomize --coverage", "bun scripts/coverage.ts"]

[tasks.start]
run = "bun src/index.ts"

[tasks.claude]
description = "Launch Claude with only this MCP server and its development channel"
run = "bun scripts/launch.ts"

[tasks."claude:plugin"]
description = "Launch the installed plugin with its development channel enabled"
run = "bun scripts/launch.ts --plugin"

[tasks.build]
description = "Build the npm package and validate the Claude plugin"
run = ["bun scripts/package-plugin.ts", "claude plugin validate --strict .claude-plugin/marketplace.json", "claude plugin validate --strict plugins/claude-codex-bridge"]

[tasks.smoke]
description = "Exercise real Codex start, live steering, interruption and recovery through MCP"
run = "bun scripts/smoke.ts"

[tasks.hooks]
description = "Run commit hooks over all tracked files"
run = "prek run --all-files"

[tasks."release:prepare"]
description = "Bump all project version references: patch, minor, or major"
run = "bun scripts/release.ts bump"
