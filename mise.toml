[tools]
codex = "0.153.4"
claude = "2.1.261"
node = "24.20.0"
prek = "0.4.14"
rumdl = "0.2.61"

[tasks.setup]
run = ["npm ci", "codex app-server generate-ts --experimental --out .generated", "git config --get core.hooksPath > /dev/null || prek install"]

[tasks.check]
depends = ["build"]
run = ["node scripts/release.ts verify", "rumdl check --no-config .", "npm run lint", "npm run typecheck", "npm test"]

[tasks.test]
depends = ["build"]
run = ["npm test"]

[tasks.start]
depends = ["build"]
run = "node dist/server.js"

[tasks.claude]
depends = ["build"]
description = "Launch Claude with only this MCP server and its development channel"
run = "node scripts/launch.ts"

[tasks."claude:plugin"]
description = "Launch the installed plugin with its development channel enabled"
run = "node scripts/launch.ts --plugin"

[tasks.build]
description = "Build the npm package and validate the Claude plugin"
run = ["node scripts/package-plugin.ts", "claude plugin validate --strict .claude-plugin/marketplace.json", "claude plugin validate --strict plugins/claude-codex-bridge"]

[tasks.smoke]
depends = ["build"]
description = "Exercise real Codex start, live steering, interruption and recovery through MCP"
run = "node scripts/smoke.ts"

[tasks.hooks]
description = "Run commit hooks over all tracked files"
run = "prek run --all-files"

[tasks."release:prepare"]
description = "Bump all project version references: patch, minor, or major"
run = "node scripts/release.ts bump"
