repos:
  - repo: local
    hooks:
      - id: biome
        name: biome
        entry: mise exec -- npm exec --no -- biome check --no-errors-on-unmatched
        language: system
        types_or: [ts, json]
      - id: markdown
        name: markdown
        entry: mise exec -- rumdl check --no-config
        language: system
        types: [markdown]
