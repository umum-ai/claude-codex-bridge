name: release-label

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  release-label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4.3.0
        with:
          install: false
      - run: mise install node
      - name: Validate the optional manual release decision
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: mise exec -- node scripts/release.ts level "$LABELS"
