name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4.3.0
      - run: mise run setup
      - run: mise run check
      - name: Preserve the installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: claude-codex-bridge
          path: .runtime/release/
          if-no-files-found: error
